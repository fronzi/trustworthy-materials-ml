[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trustworthy-materials-ml"
version = "0.1.0"
description = "Uncertainty-aware materials machine learning and adaptive quantum-sensing simulation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Marco Fronzi" }]
dependencies = [
  "joblib>=1.3",
  "lightgbm>=4.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "pymatgen>=2024.8",
  "qutip>=5.0",
  "requests>=2.31",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "torch>=2.2",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["hypothesis>=3.0", "mypy>=1.9", "pandas-stubs", "pytest>=8", "pytest-cov>=5", "ruff>=0.4", "types-requests"]

[project.scripts]
trustmat = "trustmat.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/trustmat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=trustmat --cov-report=term-missing:skip-covered"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY", "RUF"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["src"]
